name: Container Build & Push

on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "api/**"
  workflow_dispatch:

jobs:
  build-push:
    name: Build & Push Container Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/sun475300-sudo/swarm-drone-atc:${{ github.sha }}
            ${{ github.ref_name == 'main' && 'ghcr.io/sun475300-sudo/swarm-drone-atc:latest' || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for CRITICAL vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/sun475300-sudo/swarm-drone-atc:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL

  helm-lint:
    name: Helm Chart Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: "latest"

      - name: Lint Helm chart
        run: helm lint deployment/helm/sdacs/
