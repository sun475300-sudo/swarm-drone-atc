name: Desktop Build (Win/Mac/Linux)

# SDACS 데스크탑 앱 빌드 — Win NSIS · Mac DMG · Linux AppImage.
# 트리거: v* 태그 push → GitHub Releases 자동 발행(공개)
#        main push (desktop/* 변경) → artifact 업로드(스모크)
#        수동 실행(workflow_dispatch)
on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - 'swarm_3d_simulator.html'
      - 'maritime_detection_simulator.html'
      - 'vendor/three/**'
      - 'package.json'
      - '.github/workflows/desktop-build.yml'

permissions:
  contents: write   # GitHub Releases 업로드용

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npm run dist:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        run: npm run dist:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sdacs-desktop-${{ matrix.os }}
          path: |
            dist-desktop/*.exe
            dist-desktop/*.dmg
            dist-desktop/*.AppImage
            dist-desktop/*.zip
          if-no-files-found: ignore
          retention-days: 30

  release:
    name: Publish to GitHub Releases
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          generate_release_notes: true
          draft: false
          prerelease: false
          name: SDACS Desktop ${{ github.ref_name }}
          body: |
            ## SDACS 데스크탑 앱 다운로드

            **자동 빌드**: Win NSIS · macOS DMG · Linux AppImage

            ### 설치 방법
            - **Windows**: `*.exe` 다운로드 → 실행
            - **macOS**: `*.dmg` 다운로드 → 마운트 → 앱 드래그
            - **Linux**: `*.AppImage` 다운로드 → `chmod +x` → 실행

            ### 포함된 시뮬레이터
            - 군집 드론 3D 시뮬레이터 (`swarm_3d_simulator.html`)
            - 해양 탐지 시뮬레이터 (`maritime_detection_simulator.html`)

            전체 소스: https://github.com/${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
