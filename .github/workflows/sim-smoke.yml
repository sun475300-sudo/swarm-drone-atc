name: Simulator Smoke Test

# swarm_3d_simulator.html(메인 시뮬레이터)와 maritime_detection_simulator.html(해양)
# 의 _sdacs/_mds API를 헤드리스 브라우저로 검증.
on:
  push:
    paths:
      - 'swarm_3d_simulator.html'
      - 'maritime_detection_simulator.html'
      - 'tests/e2e/**'
      - '.github/workflows/sim-smoke.yml'
  pull_request:
    paths:
      - 'swarm_3d_simulator.html'
      - 'maritime_detection_simulator.html'
      - 'tests/e2e/**'
      - '.github/workflows/sim-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright + Chromium
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install -D playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Serve simulator
        run: |
          python3 -m http.server 8123 >/tmp/httpd.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -sf -o /dev/null http://localhost:8123/swarm_3d_simulator.html; then echo "server up"; break; fi
            sleep 1
          done

      - name: Run swarm smoke test
        env:
          SIM_URL: http://localhost:8123/swarm_3d_simulator.html
        run: node tests/e2e/smoke_sim.mjs

      - name: Run maritime smoke test
        env:
          SIM_URL: http://localhost:8123/maritime_detection_simulator.html
        run: node tests/e2e/smoke_maritime.mjs

  # Phase 1-9 세부 기능별 Playwright E2E (ATC·TAC·CIN·INJ·CAM·AUD·MIS·ANA·MOB).
  # node 스모크가 API 표면을 검증한다면, 이쪽은 각 Phase 명령·상태 전환을 케이스별로 검증.
  e2e-pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Playwright + deps
        run: |
          python -m pip install --upgrade pip
          # conftest.py(numpy/yaml) + e2e 픽스처(playwright)만 필요한 최소 집합.
          # playwright는 node 스모크 잡(1.56.1)과 동일 Chromium rev(1194)에 핀.
          pip install pytest "playwright==1.56.0" numpy pyyaml
          python -m playwright install --with-deps chromium

      - name: Run simulator Phase E2E (ATC/TAC/CIN/INJ/CAM/AUD/MIS/ANA/MOB)
        # addopts(xdist·cov)를 비워 브라우저 E2E에 무관한 커버리지 게이트를 우회.
        run: |
          python -m pytest \
            tests/e2e/test_simulator_atc.py \
            tests/e2e/test_simulator_tac.py \
            tests/e2e/test_simulator_cin_inj.py \
            tests/e2e/test_simulator_cam_aud.py \
            tests/e2e/test_simulator_mis_ana_mob.py \
            -o addopts="" -p no:cacheprovider -v
