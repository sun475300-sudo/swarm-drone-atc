name: Simulator Smoke Test

# swarm_3d_simulator.html(메인 ATC 시뮬레이터)와 maritime_detection_simulator.html(해양)
# 의 _sdacs/_mds API를 헤드리스 브라우저로 검증.
# Phase 1-9 (ATC/TAC/CIN/CAM/MIS/INJ/ANA/AUD/MOB) Playwright E2E 통합.
on:
  push:
    paths:
      - 'swarm_3d_simulator.html'
      - 'maritime_detection_simulator.html'
      - 'visualization/swarm_3d_simulator.html'
      - 'docs/swarm_3d_simulator.html'
      - 'docs/simulator.html'
      - 'manifest.webmanifest'
      - 'sdacs-sw.js'
      - 'tests/e2e/**'
      - 'scripts/extract_sdacs_api.py'
      - '.github/workflows/sim-smoke.yml'
  pull_request:
    paths:
      - 'swarm_3d_simulator.html'
      - 'maritime_detection_simulator.html'
      - 'visualization/swarm_3d_simulator.html'
      - 'docs/swarm_3d_simulator.html'
      - 'docs/simulator.html'
      - 'manifest.webmanifest'
      - 'sdacs-sw.js'
      - 'tests/e2e/**'
      - 'scripts/extract_sdacs_api.py'
      - '.github/workflows/sim-smoke.yml'
  workflow_dispatch:

jobs:
  js-syntax:
    name: JS 구문 검사 (node --check)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Extract + check swarm script
        run: |
          python3 -c "
          import re
          for f in ['swarm_3d_simulator.html', 'maritime_detection_simulator.html']:
              s = open(f).read()
              m = re.search(r'<script type=\"module\">(.*?)</script>', s, re.DOTALL)
              if m:
                  out = f.replace('.html', '_extracted.mjs')
                  open('/tmp/' + out, 'w').write(m.group(1))
                  print(f'extracted: /tmp/{out} ({len(m.group(1))} chars)')
          "
          node --check /tmp/swarm_3d_simulator_extracted.mjs
          node --check /tmp/maritime_detection_simulator_extracted.mjs

  smoke-node:
    name: Node 헤드리스 스모크 (smoke_sim.mjs · smoke_maritime.mjs)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Playwright + Chromium
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install -D playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Serve simulator
        run: |
          python3 -m http.server 8123 >/tmp/httpd.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -sf -o /dev/null http://localhost:8123/swarm_3d_simulator.html; then echo "server up"; break; fi
            sleep 1
          done

      - name: Run swarm smoke test
        env:
          SIM_URL: http://localhost:8123/swarm_3d_simulator.html
        run: node tests/e2e/smoke_sim.mjs

      - name: Run maritime smoke test
        env:
          SIM_URL: http://localhost:8123/maritime_detection_simulator.html
        run: node tests/e2e/smoke_maritime.mjs

  smoke-pytest:
    name: Python Playwright E2E (200 Phase 통합 — MEGA·HYPER·STELLAR·ULTIMATE·POST-UNIVERSE)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install pytest + playwright (python)
        run: |
          python -m pip install --upgrade pip
          # numpy/pyyaml: 공유 tests/conftest.py가 collection 단계에서 numpy를 import하므로 필수
          # pytest-cov: pyproject.toml addopts의 --cov/--no-cov 인자를 인식시키기 위해 필요
          pip install pytest pytest-xdist pytest-cov playwright numpy pyyaml hypothesis
          python -m playwright install --with-deps chromium

      - name: Run all 200-Phase E2E
        run: |
          python -m pytest tests/e2e/ -v --no-cov -n auto \
            --ignore=tests/e2e/test_desktop_phase12.py  # AppImage 빌드 필요, 별도 job

      - name: API 문서 정합성 게이트 (Track G-2 — 실측 vs SDACS_API.md/sdacs.d.ts)
        run: python scripts/extract_sdacs_api.py --check

      - name: 사본 md5 일치 게이트 (Track G-4)
        run: |
          test "$(md5sum swarm_3d_simulator.html visualization/swarm_3d_simulator.html docs/simulator.html docs/swarm_3d_simulator.html | awk '{print $1}' | sort -u | wc -l)" = 1 \
            && echo "✅ 군집 4 사본 md5 일치" \
            || { echo "❌ 군집 사본 불일치 — 동기화 필요"; exit 1; }
