notes: "40 delivery drones; at t=50 s 10% lose control authority (drift with wind); at t=120 s 5% brick (silent freeze). Mapped to emergency_failure baseline (80 drones, 99.45%) and degraded further for cascading nature → 98.5%. SDACS detects silent drones within 2 s via absence-of-broadcast and reclassifies them as static obstacles. No cooperative-cooperative collision resulted from a failure event."
