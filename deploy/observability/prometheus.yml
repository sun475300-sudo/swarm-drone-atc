global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: sdacs

# 스크레이프 설정
scrape_configs:
  # SDACS FastAPI 백엔드 (Prometheus 미들웨어 활성화 필요: /metrics 엔드포인트)
  - job_name: sdacs_api
    static_configs:
      - targets: ["host.docker.internal:8080"]
    metrics_path: /metrics

  # Prometheus 자체 모니터링
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Grafana 모니터링
  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
    metrics_path: /metrics
