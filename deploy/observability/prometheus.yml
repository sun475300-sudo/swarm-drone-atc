global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: sdacs

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: sdacs_backend
    static_configs:
      - targets: ["backend:8080"]
    metrics_path: /metrics

  - job_name: sdacs_simulator
    static_configs:
      - targets: ["backend:8081"]
    metrics_path: /metrics

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
