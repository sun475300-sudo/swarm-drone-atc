apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-sdacs
  labels:
    app: {{ .Release.Name }}-sdacs
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-sdacs
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-sdacs
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.service.apiPort }}"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: sdacs
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: dash
              containerPort: {{ .Values.service.dashPort }}
            - name: api
              containerPort: {{ .Values.service.apiPort }}
          env:
            {{- range $key, $val := .Values.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.gpu.enabled }}
          resources:
            limits:
              nvidia.com/gpu: {{ .Values.gpu.count }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: api
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: api
            initialDelaySeconds: 5
            periodSeconds: 10
