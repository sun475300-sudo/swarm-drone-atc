# SDACS GPU 배포 설정
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sdacs
  labels:
    app: sdacs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sdacs
  template:
    metadata:
      labels:
        app: sdacs
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      automountServiceAccountToken: false
      containers:
        - name: sdacs
          image: sdacs:gpu
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8050
              name: dash
            - containerPort: 8000
              name: api
          resources:
            limits:
              nvidia.com/gpu: 1
              cpu: "4"
              memory: "8Gi"
            requests:
              nvidia.com/gpu: 1
              cpu: "1"
              memory: "2Gi"
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
