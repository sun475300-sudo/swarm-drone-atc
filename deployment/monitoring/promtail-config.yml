server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # SDACS 감사 로그
  - job_name: sdacs_audit
    static_configs:
      - targets:
          - localhost
        labels:
          job: sdacs_audit
          service: sdacs
          __path__: /logs/audit.jsonl
    pipeline_stages:
      - json:
          expressions:
            ts: ts
            actor: actor
            action: action
            success: success
      - labels:
          actor:
          action:
          success:
      - timestamp:
          source: ts
          format: Unix

  # Docker 컨테이너 로그 (sdacs 서비스만)
  - job_name: docker_sdacs
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values:
              - com.docker.compose.service=sdacs-api
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container
      - source_labels: [__meta_docker_container_log_stream]
        target_label: stream
    pipeline_stages:
      - json:
          expressions:
            level: level
            logger: logger
            message: msg
      - labels:
          level:
          logger:
