    { n: 193, name: 'Beyond Physics', band: 'post-universe', api: 'p193BeyondPhysics' },
    { n: 194, name: 'Beyond Computation', band: 'post-universe', api: 'p194BeyondComputation' },
    { n: 195, name: 'Beyond Time', band: 'post-universe', api: 'p195BeyondTime' },
    { n: 196, name: 'Beyond Space', band: 'post-universe', api: 'p196BeyondSpace' },
    { n: 197, name: 'Beyond Existence', band: 'post-universe', api: 'p197BeyondExistence' },
    { n: 198, name: 'Pure Information', band: 'post-universe', api: 'p198PureInformation' },
    { n: 199, name: 'Universal Identity', band: 'post-universe', api: 'p199UniversalIdentity' },
    { n: 200, name: '𝟏 Unity (모든 것이 하나)', band: 'post-universe', api: 'p200UnityAchieved', unity: true },
];

const grid = document.getElementById('grid');
const filters = document.querySelectorAll('.filter');
function render(band) {
    grid.innerHTML = '';
    for (const p of PHASES) {
        if (band !== 'all' && p.band !== band) continue;
        const card = document.createElement('div');
        card.className = `card ${p.band}${p.unity ? ' punity' : ''}`;
        card.innerHTML = `<div class="pnum">Phase ${p.n}</div><div class="ptitle">${p.name}</div><div class="pnum" style="margin-top:4px;">${p.api}</div>`;
        card.onclick = () => {
            navigator.clipboard?.writeText(`window._sdacs.${p.api.split(' ')[0]}();`).catch(() => {});
            alert(`Phase ${p.n}: ${p.name}\n\nAPI 호출 코드가 클립보드에 복사되었습니다:\nwindow._sdacs.${p.api}\n\n시뮬레이터 콘솔(F12)에서 붙여넣기 실행하세요.`);
        };
        grid.appendChild(card);
    }
}
filters.forEach(f => f.onclick = () => {
    filters.forEach(x => x.classList.toggle('active', x === f));
    render(f.dataset.band);
});
render('all');
</script>
