apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sdacs.fullname" . }}-config
  labels:
    {{- include "sdacs.labels" . | nindent 4 }}
data:
  SDACS_LOG_LEVEL: {{ .Values.env.SDACS_LOG_LEVEL | quote }}
  REDIS_URL: {{ printf "redis://%s-redis:%d" (include "sdacs.fullname" .) (.Values.redis.port | int) | quote }}
