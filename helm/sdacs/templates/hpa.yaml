# ============================================================
# HorizontalPodAutoscaler — CPU/메모리 기반 자동 스케일링
# 드론 시뮬레이션 부하 급증 시 자동으로 Pod 수를 확장
# CPU 70% 또는 메모리 80% 초과 시 스케일 아웃 트리거
# ============================================================
{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "sdacs.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sdacs.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "sdacs.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetMemoryUtilizationPercentage }}
{{- end }}
