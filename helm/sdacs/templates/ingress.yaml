# ============================================================
# SDACS Ingress — nginx 컨트롤러 기반 외부 트래픽 라우팅
# 경로별 라우팅:
#   /         → 대시보드 서비스 (Dash 3D 시각화)
#   /api/*    → 백엔드 서비스 (FastAPI REST API)
#   /ws/*     → 백엔드 서비스 (WebSocket /ws/telemetry)
# ============================================================
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "sdacs.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sdacs.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "sdacs.fullname" $ }}-{{ .service }}
                port:
                  number: {{ if eq .service "backend" }}{{ $.Values.service.backendPort }}{{ else }}{{ $.Values.service.dashboardPort }}{{ end }}
          {{- end }}
    {{- end }}
{{- end }}
