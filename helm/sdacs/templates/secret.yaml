# ============================================================
# SDACS Secret — 민감한 자격증명 저장 (base64 인코딩)
# 실제 운영 환경에서는 Vault, Sealed Secrets, External Secrets
# Operator 등의 솔루션으로 교체를 강력히 권장
# ⚠️ 플레이스홀더 값은 반드시 실제 값으로 교체할 것
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sdacs.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sdacs.labels" . | nindent 4 }}
  annotations:
    # 프로덕션 배포 전 반드시 실제 자격증명으로 교체할 것
    helm.sh/note: "Replace placeholder values before production deployment"
type: Opaque
data:
  # ---- PostgreSQL / TimescaleDB 자격증명 ----
  # base64("sdacs_password") — 실제 운영에서는 강력한 비밀번호로 교체
  # echo -n "your-password" | base64
  POSTGRES_PASSWORD: {{ "sdacs_password_placeholder" | b64enc | quote }}
  POSTGRES_USER: {{ "sdacs" | b64enc | quote }}
  POSTGRES_DB: {{ .Values.postgresql.database | b64enc | quote }}

  # ---- Redis 인증 (필요 시) ----
  # Redis 비밀번호가 필요하면 설정 (기본값: 빈 문자열 = 인증 없음)
  REDIS_PASSWORD: {{ "" | b64enc | quote }}

  # ---- 외부 서비스 통합 ----
  # Discord Webhook URL (시뮬레이션 알림용, 선택사항)
  DISCORD_WEBHOOK_URL: {{ "" | b64enc | quote }}

  # ---- 애플리케이션 시크릿 ----
  # JWT 서명 키 (API 인증 사용 시 필수)
  # python -c "import secrets; print(secrets.token_hex(32))" | base64
  SECRET_KEY: {{ "change-me-in-production" | b64enc | quote }}
