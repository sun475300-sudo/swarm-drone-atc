{{- if .Values.timescaledb.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "sdacs.fullname" . }}-timescaledb
  labels:
    {{- include "sdacs.labels" . | nindent 4 }}
    app.kubernetes.io/component: timescaledb
spec:
  serviceName: {{ include "sdacs.fullname" . }}-timescaledb
  replicas: 1
  selector:
    matchLabels:
      {{- include "sdacs.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: timescaledb
  template:
    metadata:
      labels:
        {{- include "sdacs.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: timescaledb
    spec:
      containers:
        - name: timescaledb
          image: {{ .Values.timescaledb.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.timescaledb.port }}
              name: postgres
          env:
            - name: POSTGRES_DB
              value: {{ .Values.timescaledb.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.timescaledb.user | quote }}
            - name: POSTGRES_PASSWORD
              {{- if .Values.timescaledb.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.timescaledb.existingSecret }}
                  key: password
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "sdacs.fullname" . }}-secret
                  key: db-password
              {{- end }}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.timescaledb.user | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.timescaledb.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  {{- if .Values.timescaledb.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.timescaledb.persistence.storageClass }}
        storageClassName: {{ .Values.timescaledb.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.timescaledb.persistence.size }}
  {{- else }}
      volumes:
        - name: data
          emptyDir: {}
  {{- end }}
{{- end }}
