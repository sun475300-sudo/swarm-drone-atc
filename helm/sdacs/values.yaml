# SDACS Helm 기본값 — 환경별로 values-<env>.yaml로 오버라이드
replicaCount: 1

image:
  repository: sdacs
  tag: "latest"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  dashPort: 8050
  apiPort: 8000

ingress:
  enabled: true
  className: nginx
  host: sdacs.local
  tls: []
  # tls:
  #   - secretName: sdacs-tls
  #     hosts: [sdacs.example.com]

resources:
  limits:
    cpu: "2"
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 1Gi

gpu:
  enabled: false  # true로 설정 시 nvidia.com/gpu: 1 요청

env:
  PYTHONUNBUFFERED: "1"
  LOG_LEVEL: INFO
  # DB_URL은 Secret으로 주입 (아래 secret 섹션 참고)

secret:
  # DB_URL, JWT_SECRET_KEY 등 민감 값을 쿠버네티스 Secret에서 로드
  # kubectl create secret generic sdacs-secret --from-literal=DB_URL=... --from-literal=JWT_SECRET_KEY=...
  name: sdacs-secret
  mountEnvFrom: true

timescaledb:
  enabled: false  # 별도 TimescaleDB 파드 포함 여부
  image: timescale/timescaledb:2.14.2-pg16
  storageSize: 10Gi
  postgresPassword: ""  # Secret에서 주입 권장

prometheus:
  scrape: true
  path: /metrics
  port: 8000

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: /metrics
  prometheus.io/port: "8000"

nodeSelector: {}
tolerations: []
affinity: {}
