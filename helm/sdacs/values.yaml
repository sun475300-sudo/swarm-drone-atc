# SDACS Helm default values

replicaCount: 1

image:
  repository: ghcr.io/sun475300-sudo/swarm-drone-atc
  pullPolicy: IfNotPresent
  tag: ""  # overridden by CI with git SHA

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

api:
  port: 8000
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70

timescaledb:
  enabled: true
  image: timescale/timescaledb:latest-pg16
  port: 5432
  database: sdacs
  user: sdacs
  existingSecret: ""       # set to use external secret; key must be "password"
  password: "sdacs_dev"    # ignored if existingSecret set
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

redis:
  enabled: true
  image: redis:7.2-alpine
  port: 6379
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: sdacs.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

env:
  SDACS_LOG_LEVEL: INFO
  # DATABASE_URL and JWT_SECRET come from the sdacs-secret Secret

nodeSelector: {}
tolerations: []
affinity: {}
