# Default values for sdacs Helm chart.
# Converted from docker-compose.yml (P715).

# -- Redis 설정
redis:
  image:
    repository: redis
    tag: "7.2-alpine"
    pullPolicy: IfNotPresent
  service:
    port: 6379
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  command: ["redis-server", "--notify-keyspace-events", "KEA"]

# -- SDACS 백엔드 (FastAPI)
backend:
  enabled: true
  replicaCount: 1
  image:
    repository: sdacs/backend
    tag: "latest"
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 8080
  env:
    REDIS_URL: "redis://sdacs-redis:6379"
    VLLM_URL: "http://sdacs-vllm:8000"
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

# -- Dash 3D 대시보드
dashboard:
  enabled: true
  replicaCount: 1
  image:
    repository: sdacs/dashboard
    tag: "latest"
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 3000
  env:
    BACKEND_URL: "http://sdacs-backend:8080"
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# -- Ingress 설정
ingress:
  enabled: false
  className: "nginx"
  annotations: {}
  hosts:
    - host: sdacs.local
      paths:
        - path: /
          pathType: Prefix
          service: dashboard
          port: 3000
        - path: /api
          pathType: Prefix
          service: backend
          port: 8080
  tls: []

# -- GPU vLLM 추론 서버 (GPU 노드 필요)
vllm:
  enabled: false
  image:
    repository: vllm/vllm-openai
    tag: "latest"
    pullPolicy: Always
  service:
    port: 8000
  model: "Qwen/Qwen2.5-7B-Instruct"
  maxModelLen: 2048
  gpuMemoryUtilization: "0.85"
  resources:
    limits:
      nvidia.com/gpu: 1

# -- 시뮬레이터 설정
simulator:
  drones:
    defaultCount: 30
  seed: 42
