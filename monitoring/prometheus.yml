# P718 — Prometheus 수집 설정
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: sdacs
    env: production

rule_files:
  - "rules/*.yml"

scrape_configs:
  - job_name: sdacs-api
    static_configs:
      - targets: ["sdacs-api:8080"]
    metrics_path: /metrics
    scrape_interval: 10s

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

alerting:
  alertmanagers:
    - static_configs:
        - targets: []
