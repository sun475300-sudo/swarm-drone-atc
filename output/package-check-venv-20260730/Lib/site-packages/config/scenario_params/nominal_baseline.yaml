scenario: s10_nominal_low_density_baseline
description: "공칭 저밀도 기준선 — 표준 벤치마크 정규화용 대조(control) 케이스"

# 표준 벤치마크 스위트(SDACS-SBS-10)의 대조 케이스. 충돌·충돌위험이 거의
# 발생하지 않는 가장 단순한 공칭 운용으로, 모든 도구가 통과해야 하는 하한선이자
# 타 시나리오 지표를 정규화하는 기준점(0에 가까운 기준 충돌률)을 제공한다.
drone_count: 10
simulation_duration_min: 10
arrival_rate_per_min: 2        # Poisson 도착률 (저밀도)
area_km2: 100

drone_profile_distribution:
  COMMERCIAL_DELIVERY: 0.7
  SURVEILLANCE: 0.3

route_generation:
  type: random_od              # 랜덤 출발-목적지 쌍
  min_distance_km: 2.0
  max_distance_km: 8.0

success_criteria:
  collision_count: 0
  conflict_resolution_rate_min: 1.0
  route_efficiency_max: 1.05
