[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-drone-atc"
version = "1.5.0"
description = "군집드론 공역통제 자동화 시스템 (SDACS)"
authors = [
    {name = "jangsunwoo", email = "sun475300@gmail.com"}
]
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24",
    "simpy>=4.1",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "dash>=3.0",
    "plotly>=6.0",
    "joblib>=1.3",
    "tqdm>=4.66",
    "pandas>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.0",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.5",
    "mypy>=1.18",
    "ruff>=0.4",
    "hypothesis>=6.100",
]
gpu = [
    "torch>=2.0",
]

[project.scripts]
sdacs = "main:main"

[project.urls]
Repository = "https://github.com/sun475300-sudo/swarm-drone-atc"
Demo = "https://heartfelt-axolotl-2f9af2.netlify.app"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short -n auto --dist loadfile --cov=src --cov=simulation --cov-report=term-missing --cov-fail-under=80"
markers = [
    "unit: 단위 테스트 (개별 함수/클래스)",
    "integration: 통합 테스트 (다중 모듈 상호작용)",
    "e2e: End-to-End 테스트 (전체 시뮬레이션 파이프라인)",
    "slow: 느린 테스트 (>10초)",
    "gpu: GPU 가속 테스트",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
no_implicit_optional = true
exclude = ["tests/", "archive/", "visualization/"]

[[tool.mypy.overrides]]
module = ["simulation.*"]
ignore_errors = true


[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"archive/**" = [
    "B006", "B007", "B905",
    "C416",
    "E402", "E701", "E702", "E731", "E741", "E999",
    "F401", "F811", "F821", "F841",
    "I001",
    "N801", "N803", "N806", "N815",
    "SIM102", "SIM103", "SIM108", "SIM118",
    "UP006", "UP035", "UP045",
]
"visualization/**" = ["C408", "E402", "F401", "F841", "SIM102", "UP035"]
"tests/**" = [
    "B007", "B011", "B017", "B905",
    "C401", "C408",
    "E402", "E702", "E731", "E741",
    "F841",
    "N806",
    "SIM102", "SIM105", "SIM108", "SIM115", "SIM222",
    "W293",
]
"gen_presentation_v7.py" = ["E402", "N806", "SIM108"]
"gen_report_v6.py" = ["E402", "N806"]
"gen_report_v7_easy.py" = ["E402", "N806"]
"notebooks/**" = ["E402"]
"scripts/benchmark_gpu.py" = ["E402"]
"scripts/comparison_experiment.py" = ["E402"]
"scripts/generate_charts.py" = ["E402"]
"simulation/**" = ["N806", "N803", "E741", "E402"]
"simulation/autoML_pipeline.py" = ["N999"]
"simulation/faa_laanc.py" = ["N801"]
"src/sensor_fusion.py" = ["N806", "E741"]
